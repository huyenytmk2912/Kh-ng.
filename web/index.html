<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Khương Agent</title><style>body{font:16px system-ui;background:#f5f5f5;padding:18px}.card{max-width:520px;margin:auto;background:#fff;padding:18px;border-radius:18px}textarea,input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border-radius:12px;border:1px solid #ddd;font-size:16px}button{background:#111;color:#fff;border:0;font-weight:600}.stop{background:#c62828}</style><div class=card><h2>🤖 Khương — ChatGPT Agent</h2><textarea id=m rows=5 placeholder="Tin nhắn..."></textarea><input id=c type=number min=1 value=1 placeholder="Số lần"><input id=d type=number min=1 value=10 placeholder="Delay (giây)"><button onclick=start()>▶ Bắt đầu</button><button class=stop onclick=stop()>■ Dừng</button><p id=s>Đang chờ</p></div><script>async function api(p,b){let r=await fetch('/api/'+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});return r.json()}async function start(){let r=await api('start',{message:m.value,count:+c.value,delay:+d.value});s.textContent=r.message}async function stop(){let r=await api('stop',{});s.textContent=r.message}</script>
