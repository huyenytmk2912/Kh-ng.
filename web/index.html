<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0c"><title>Khương Agent</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#17181a;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:520px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border:1px solid #e6e7ea;border-radius:22px;padding:18px;box-shadow:0 8px 30px #0000000d}.brand{display:flex;align-items:center;gap:10px;margin:4px 2px 18px}.brand b{font-size:25px}.sub{color:#73767c;font-size:13px;margin-top:2px}label{display:block;font-weight:650;font-size:14px;margin:14px 2px 7px}textarea,input,button{font:inherit;width:100%;border-radius:13px}textarea,input{border:1px solid #d8dbe0;background:#fff;padding:14px;outline:none}textarea:focus,input:focus{border-color:#555;box-shadow:0 0 0 3px #0000000b}textarea{min-height:130px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}button{border:0;padding:14px;font-weight:700;cursor:pointer}.start{background:#111;color:#fff}.stop{background:#d83b32;color:#fff}.status{margin-top:14px;padding:13px;border-radius:12px;background:#f0f1f3;color:#555}.top{display:flex;justify-content:space-between;align-items:center}.logout{width:auto;padding:8px 10px;background:#eee;color:#333;font-size:13px}</style></head><body><main class="wrap"><section class="card"><div class="top"><div class="brand"><div style="font-size:32px">🤖</div><div><b>Khương Agent</b><div class="sub">ChatGPT Web • VPS control</div></div></div><button class="logout" onclick="logout()">Đăng xuất</button></div><label for="m">Tin nhắn</label><textarea id="m" placeholder="Nhập nội dung cần gửi..."></textarea><div class="grid"><div><label for="c">Số lần</label><input id="c" type="number" min="1" max="100" value="1"></div><div><label for="d">Delay (giây)</label><input id="d" type="number" min="1" value="10"></div></div><div class="actions"><button class="start" onclick="start()">▶ Bắt đầu</button><button class="stop" onclick="stop()">■ Dừng</button></div><div id="s" class="status">● Đang chờ</div></section></main><script>async function api(p,b={}){let r=await fetch('/api/'+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});if(r.status===401){location.href='/login.html';return{}}return r.json()}async function start(){if(!m.value.trim())return s.textContent='⚠️ Hãy nhập tin nhắn';let r=await api('start',{message:m.value,count:+c.value,delay:+d.value});s.textContent=r.message||'Đã khởi động'}async function stop(){let r=await api('stop');s.textContent=r.message||'Đã dừng'}async function logout(){await api('logout');location.href='/login.html'}</script></body></html>
