<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0c"><title>Đăng nhập • Khương Agent</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17181a}.box{max-width:420px;margin:12vh auto;padding:24px;background:#fff;border:1px solid #e6e7ea;border-radius:22px;box-shadow:0 8px 30px #0000000d}h1{margin:0 0 5px;font-size:25px}.sub{color:#777;margin-bottom:22px;font-size:14px}label{display:block;font-weight:650;margin:14px 0 7px}input,button{width:100%;padding:14px;border-radius:13px;font:inherit}input{border:1px solid #d8dbe0}button{margin-top:18px;border:0;background:#111;color:#fff;font-weight:700}.err{margin-top:12px;color:#c62828;min-height:22px}</style></head><body><main class="box"><div style="font-size:34px">🤖</div><h1>Khương Agent</h1><div class="sub">Đăng nhập để điều khiển agent trên VPS</div><form onsubmit="login(event)"><label>Tài khoản</label><input id="u" autocomplete="username" required><label>Mật khẩu</label><input id="p" type="password" autocomplete="current-password" required><button>Đăng nhập</button></form><div id="e" class="err"></div></main><script>async function login(ev){ev.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)location.href='/';else e.textContent='Sai tài khoản hoặc mật khẩu';}</script></body></html>
